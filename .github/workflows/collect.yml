name: 실거래가 수집 (서울·경기)

on:
  schedule:
    - cron: "0 21 * * *" # 매일 06:00 KST
  workflow_dispatch:
    inputs:
      months:
        description: "최근 몇 개월을 수집할지 (최초 적재는 36 권장)"
        default: "2"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # 36개월 최초 적재는 1시간 이상 걸림
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - run: python collector/collect.py --months "${{ github.event.inputs.months || '2' }}"
        env:
          PUBLIC_DATA_SERVICE_KEY: ${{ secrets.PUBLIC_DATA_SERVICE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
